name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Design lint
        run: npm run lint:design

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload Worker version (preview)
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
          # Preview shares production bindings; do not run remote migrations here.

      - name: Comment preview info
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Cloudflare preview',
              '',
              'Worker version uploaded via `wrangler versions upload`.',
              'Open the Cloudflare dashboard → Workers → **catalog-cms** → Versions to promote or inspect this build.',
              '',
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
